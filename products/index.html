<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 상품 코드 찾기</title><meta property="og:title" content="영상 상품 코드 찾기"><meta property="og:description" content="영상 상품 코드와 구매 조건을 확인하세요."><link rel="canonical" href="https://특가.kr/products/"><style>body{font:17px system-ui;margin:auto;max-width:680px;padding:20px;background:#fffdf7;color:#292524}a,button{color:#163d32}article{padding:18px 0;border-bottom:1px solid #ddd}input,button{padding:12px;font:inherit}a.buy{display:block;background:#163d32;color:white;padding:16px;border-radius:8px;text-align:center;margin:18px 0}small{display:block;color:#57534e}h1{font-size:25px}input{max-width:65%}</style><body><a href="../">기존 홈</a><h1>영상에서 본 상품 찾기</h1><p>상품 코드는 다른 상품에 재사용하지 않습니다.</p><label>상품 코드 <input id="code" placeholder="예: A123"></label><button id="find">찾기</button><p id="message"></p><article><a href="P0F2EE63D9457/">P0F2EE63D9457 · 국산 흰다리새우 1kg 왕새우 생새우 활새우 회 제철</a><p>기존 제목 기준 · 옵션/수량 별도 확인 필요</p><small data-until="">종료/확인 필요</small></article><script>const codes=["P0F2EE63D9457"];document.getElementById("find").onclick=()=>{const code=document.getElementById("code").value.trim().toUpperCase();if(codes.includes(code)){const params=new URLSearchParams(location.search);params.set("entry","code");location.href=code+"/?"+params.toString();}else document.getElementById("message").textContent="등록되지 않은 코드입니다.";};document.querySelectorAll("small[data-until]").forEach(el=>{if(!el.dataset.until||Date.now()>=Date.parse(el.dataset.until))el.textContent="종료/재확인 필요";});</script><script src="../samchon_measurement.js" data-enabled="false" data-code="" defer></script></body></html>
